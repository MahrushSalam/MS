<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Gesture Shortcut</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#121212;
    color:white;
}

#touchArea{
    width:90%;
    height:80vh;
    border:3px dashed #00e5ff;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    text-align:center;
    user-select:none;
    touch-action:none;
}

#result{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#00e5ff;
    color:black;
    padding:10px 20px;
    border-radius:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="result">
    Menunggu Gesture...
</div>

<div id="touchArea">
    Sentuh dan lakukan gesture
</div>

<script>

const touchArea = document.getElementById("touchArea");
const result = document.getElementById("result");

let startX,startY;
let startTime;
let longPressTimer;

touchArea.addEventListener("touchstart",(e)=>{

    const touch=e.touches[0];

    startX=touch.clientX;
    startY=touch.clientY;
    startTime=Date.now();

    longPressTimer=setTimeout(()=>{
        showResult("📌 Long Press → Context Menu");
    },1000);

});

touchArea.addEventListener("touchmove",()=>{
    clearTimeout(longPressTimer);
});

touchArea.addEventListener("touchend",(e)=>{

    clearTimeout(longPressTimer);

    const touch=e.changedTouches[0];

    let endX=touch.clientX;
    let endY=touch.clientY;

    let dx=endX-startX;
    let dy=endY-startY;

    if(Math.abs(dx)>100 || Math.abs(dy)>100){

        if(Math.abs(dx)>Math.abs(dy)){

            if(dx>0){
                showResult("➡ Swipe Right → Next Page");
            }else{
                showResult("⬅ Swipe Left → Back");
            }

        }else{

            if(dy>0){
                showResult("⬇ Swipe Down → Notification");
            }else{
                showResult("⬆ Swipe Up → Search");
            }

        }
    }

});

let lastTap=0;

touchArea.addEventListener("touchend",()=>{

    let currentTime=new Date().getTime();
    let tapLength=currentTime-lastTap;

    if(tapLength<300 && tapLength>0){
        showResult("❤️ Double Tap → Favorite");
    }

    lastTap=currentTime;

});

function showResult(text){

    result.innerHTML=text;

    navigator.vibrate?.(100);

}

</script>

</body>
</html>
